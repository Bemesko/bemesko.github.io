name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # daily rebuild so new blog posts show up without a push
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Repository variables (Settings → Secrets and variables → Actions → Variables).
      # Leave unset to publish at https://bemesko.github.io/.
      SITE_URL: ${{ vars.SITE_URL }}
      BASE_PATH: ${{ vars.BASE_PATH }}
    steps:
      - uses: actions/checkout@v7
      # never fails the build: keeps the committed posts.json if the feed is unreachable
      - name: Refresh latest blog posts
        run: node scripts/fetch-posts.mjs
      - name: Type-check and build
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
